<html lang="zh-CN">
<head>

<style>
:root{--bg:#09090f;--s1:#111118;--s2:#18182a;--s3:#1e1e30;--bd:#282844;--t:#e8e6f2;--td:#9290a8;--tm:#5c5a70;--g:#34d399;--b:#60a5fa;--p:#a78bfa;--y:#fbbf24;--r:#ef4444;--a:#f97316;--pk:#f472b6}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:'Noto Sans SC',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
code{font-family:'JetBrains Mono',monospace;background:var(--s2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--b)}
.app{max-width:720px;margin:0 auto;padding:16px 14px 80px}

/* Header */
.hdr{text-align:center;padding:24px 0 16px}
.hdr-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--a);background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.2);padding:4px 14px;border-radius:100px;margin-bottom:10px}
.hdr h1{font-size:clamp(20px,5vw,28px);font-weight:900;line-height:1.3}

/* Progress */
.prog{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.prog-bar{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .5s;background:linear-gradient(90deg,var(--g),var(--b),var(--p),var(--a))}
.phases{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.ph{flex:1;min-width:56px;background:var(--s2);border-radius:8px;padding:6px 4px;text-align:center;border:1px solid transparent;cursor:pointer;transition:border-color .2s}
.ph:hover{border-color:var(--bd)}
.ph-icon{font-size:16px}
.ph-stat{font-size:10px;font-weight:700;margin-top:2px}
.ph-bar{height:3px;background:var(--s3);border-radius:2px;margin-top:4px;overflow:hidden}
.ph-fill{height:100%;border-radius:2px;transition:width .3s}

/* Nav */
.nav{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.nav-btn{padding:6px 12px;border:1px solid var(--bd);border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;background:transparent;color:var(--td);white-space:nowrap}
.nav-btn.on{background:var(--a);color:#fff;border-color:var(--a)}
.nav-btn:hover:not(.on){background:var(--s2);color:var(--t)}
.jump{margin-left:auto;display:flex;align-items:center;gap:6px}
.jump label{font-size:11px;color:var(--tm)}
.jump select{background:var(--s1);color:var(--t);border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font-size:11px;font-family:inherit;cursor:pointer;max-width:200px}

/* Detail View */
.day-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.day-nav{padding:5px 12px;border:1px solid var(--bd);border-radius:6px;font-size:12px;cursor:pointer;background:transparent;color:var(--td);font-family:inherit;transition:all .15s}
.day-nav:hover{background:var(--s2);color:var(--t)}
.day-nav:disabled{opacity:.3;cursor:default}
.day-info{flex:1;min-width:120px}
.day-phase{font-size:10px;font-weight:700;letter-spacing:1px}
.day-title{font-size:20px;font-weight:900;margin-top:2px}
.checkin-btn{padding:6px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;border:2px solid}
.checkin-btn.done{background:var(--g);color:#000;border-color:var(--g)}
.checkin-btn.todo{background:transparent;color:var(--td);border-color:var(--bd)}
.checkin-btn.todo:hover{border-color:var(--g);color:var(--g)}

/* Week pills */
.week-pills{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.wp{padding:5px 10px;border:1px solid var(--bd);border-radius:6px;font-size:11px;cursor:pointer;background:transparent;color:var(--td);font-family:inherit;transition:all .15s;white-space:nowrap}
.wp.on{border-color:var(--b);color:var(--b);background:rgba(96,165,250,.08)}
.wp.checked{color:var(--g)}

/* Sections */
.section{background:var(--s1);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;overflow:hidden}
.sec-hdr{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--t)}
.sec-hdr:hover{background:rgba(255,255,255,.015)}
.sec-title{font-size:14px;font-weight:700}
.sec-arrow{font-size:13px;color:var(--tm);transition:transform .2s}
.sec-arrow.open{transform:rotate(90deg)}
.sec-body{padding:0 16px 14px;display:none}
.sec-body.open{display:block}

/* Content styles */
.teach{font-size:14px;color:#c0bed0;line-height:2;white-space:pre-wrap}
.key-item{display:flex;gap:10px;margin-bottom:8px;font-size:13px;color:#c0bed0;line-height:1.7}
.key-num{color:var(--y);font-weight:700;flex-shrink:0;width:18px}
.task-item{display:flex;gap:10px;margin-bottom:8px;font-size:13px;color:#c0bed0;line-height:1.7}
.task-dot{color:var(--g);flex-shrink:0}
.extend-text{font-size:13px;color:#a09eb0;line-height:1.8}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.link{font-size:12px;color:var(--b);background:rgba(96,165,250,.08);padding:4px 10px;border-radius:6px;text-decoration:none;border:1px solid transparent;transition:all .2s}
.link:hover{border-color:var(--b)}
.link.cn{color:var(--y);background:rgba(251,191,36,.08)}
.link.cn:hover{border-color:var(--y)}

/* Notes */
.notes{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.notes-label{font-size:12px;font-weight:700;color:var(--tm);margin-bottom:8px}
.notes textarea{width:100%;background:var(--s2);color:#d8d6e4;border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:13px;line-height:1.7;resize:vertical;font-family:inherit;outline:none;min-height:80px}
.notes textarea:focus{border-color:var(--b)}

/* Calendar View */
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.cal-hdr{font-size:10px;text-align:center;color:var(--tm);padding:4px 0}
.cal-day{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:6px 2px;cursor:pointer;text-align:center;min-height:38px;transition:all .15s}
.cal-day:hover{border-color:var(--b)}
.cal-day.checked{border-color:rgba(52,211,153,.3)}
.cal-num{font-size:10px;font-weight:700}
.cal-check{font-size:8px}

/* List View */
.list-phase{font-size:13px;font-weight:700;margin-bottom:8px;margin-top:16px}
.list-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:#c0bed0;transition:background .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.list-item:hover{background:var(--s2)}
.list-day{font-size:11px;font-weight:700;width:36px;flex-shrink:0}
.list-title{flex:1}
.list-icons{font-size:11px;color:var(--tm)}

/* Responsive */
@media(max-width:480px){.app{padding:10px 10px 60px}.day-title{font-size:17px}.jump{margin-left:0;width:100%}.jump select{flex:1}}
</style>
</head>

D(1,"环境搭建 + 终端入门 + 第一行代码",1,1,
`编程就是给计算机写"指令清单"。Python是一种编程语言——它的语法非常接近英语，读起来像在读句子。

打个比方：你是导演，Python代码是剧本，计算机是演员。你写好剧本（代码），演员（计算机）就按剧本一行行表演。

在开始之前，你需要认识一个重要工具——终端(Terminal)。终端是程序员和计算机对话的"文字界面"。你在里面输入命令，计算机执行。后面安装软件包、运行脚本、使用Git都离不开它。

今天最重要的是搭好"舞台"——安装Python和VS Code编辑器。就像画家需要画笔和画布，程序员需要编程语言和编辑器。`,

D(2,"变量与数据类型",1,1,
`变量就像一个"盒子"——你给它取个名字，然后把数据放进去。比如 name = "小明" 就是创建了一个叫name的盒子，里面放着"小明"这个文字。

Python有5种基本的标量数据类型（存储单个值）：
• str（字符串）：文字内容，用引号包裹 → "你好"
• int（整数）：没有小数点的数字 → 42
• float（浮点数）：有小数点的数字 → 3.14
• bool（布尔值）：只有两个值 → True 或 False
• NoneType：表示"什么都没有" → None

此外还有集合类型（存储多个值）：list列表、dict字典、tuple元组、set集合——后面几周会学。

用 type() 函数可以查看任何数据的类型。
用 f-string 可以把变量嵌入文字中：f"我叫{name}，今年{age}岁"。f-string是Python 3.6引入的特性(PEP 498)，是目前最推荐的格式化方式。`,
["变量命名规则：字母或下划线开头，不能有空格，区分大小写（name和Name是不同变量）","Python有5种标量类型(str/int/float/bool/None)和4种集合类型(list/dict/tuple/set)","f-string 是最常用的字符串格式化方式：f\"文字{变量}\"——Python 3.6+ 支持"],

D(3,"字符串深入操作",1,1,
`字符串是编程中最常用的数据类型。把它想象成一串珠子——每个字符都有编号（从0开始）。

索引："Hello"[0] → "H"（第1个字符，编号0）
切片："Hello"[1:4] → "ell"（编号1到编号4之前）
反转："Hello"[::-1] → "olleH"

字符串有很多内置方法（想象成自带的"工具箱"）：
• .upper() → 全部大写    • .lower() → 全部小写
• .split() → 按空格拆成列表   • .replace("旧","新") → 替换
• .strip() → 去除首尾空格     • .count("x") → 统计次数`,
["字符串索引从0开始，s[-1] 是最后一个字符","切片语法 s[start:stop:step]，stop位置不包含在内","字符串是不可变的(immutable)——不能直接修改某个字符，只能创建新字符串"],
["练习索引：取第1个、最后1个、中间字符","练习切片：取前5个字符、后3个字符、每隔一个取","用 split() 拆句子为单词列表，用 join() 拼接回来","写文本分析器：统计字符数、单词数、替换关键词"],
"Python3中所有字符串都是Unicode——中文、emoji都能处理。试试 len(\"你好世界\") 结果是4。",

D(4,"输入与条件判断",1,1,
`程序需要"思考"能力。条件语句让程序有了判断力。

想象你是快递分拣员：
• 如果(if) 包裹 > 20kg → 大件区
• 否则如果(elif) 包裹 > 5kg → 中件区
• 否则(else) → 小件区

Python用缩进（4个空格）标记代码块——这是Python独特的设计。

input() 获取用户输入。注意：它返回的总是字符串！
input("请输入年龄:") 得到 "25"（字符串），不是 25（数字）。
需要 int(input(...)) 转换。

比较运算符：== != > < >= <=
逻辑运算符：and  or  not`,

["写BMI计算器：输入身高体重，判断健康范围","写成绩等级程序：0-100分对应A/B/C/D/F","写简单登录验证：判断用户名和密码","用 and/or 判断闰年"],
"Python支持三元运算简写：result = \"成年\" if age >= 18 else \"未成年\"。另外 None、0、空字符串、空列表在条件中都是False。",

D(5,"复习 + 调试入门 + 猜数字游戏",1,1,
`本周学了5个核心概念：变量、数据类型、字符串、输入、条件判断。

今天除了复习，还要学一个贯穿整个编程生涯的关键技能——读错误信息(Traceback)。

当代码出错时，Python会打印"追溯信息"(Traceback)，它从下往上读：
• 最底行是错误类型和描述：TypeError: can only concatenate str to str
• 上面几行是出错位置：File "xxx.py", line 10
• 学会读Traceback = 学会自己找bug，不需要每次都问人

常见错误类型速查：
• NameError：变量名拼错了
• TypeError：类型不匹配（字符串+数字）
• SyntaxError：语法写错了（忘了冒号、引号不配对）
• IndentationError：缩进有问题

🔧 调试技巧：在可疑代码前后加 print() 查看变量值——这叫"print调试法"，简单但极其有效。`,

D(6,"for循环基础",1,2,`想象你有100张试卷要批改。你不会写100行代码，而是说"对于(for)每一张试卷，执行批改"。

D(8,"列表(List)入门",1,2,`变量只存一个数据。30个成绩怎么办？列表(List)就是"收纳箱"——存任意多个数据。

scores = [85, 92, 78, 95, 88]

列表有索引和切片（同字符串），但列表是可变的：
• .append(90) → 末尾添加
• .insert(0, 100) → 指定位置插入

[25,"虚拟环境 + OOP复习项目",5,"每个项目应该有独立的Python环境——避免包版本冲突。\n\npython -m venv myenv → 创建\nsource myenv/bin/activate → 激活(Mac/Linux)\nmyenv\\\\Scripts\\\\activate → 激活(Windows)\npip install requests → 在环境内安装\npip freeze > requirements.txt → 记录依赖\n\nOOP周项目：学生管理系统——Student、Course、GradeBook类。",["每个新项目都创建独立的虚拟环境","requirements.txt是依赖清单——别人能完美复现你的环境","pip freeze > requirements.txt 记录所有包及版本"],["为本周OOP项目创建虚拟环境","完成学生管理系统（OOP设计+JSON持久化）","生成requirements.txt","git add + commit + push到GitHub"],"uv是比pip更快的Python包管理器（Rust写的），可以替代venv+pip。Poetry则是依赖管理的高级工具。这些在后面的项目中可以尝试。",[["Python venv文档(中文)","https://docs.python.org/zh-cn/3/library/venv.html","cn"]]],

[26,"HTTP基础 + 第一个API调用",6,"API就是\"程序间对话\"。比喻：餐厅里你是客户端，厨房是服务器，服务员是API。\n\nHTTP是对话协议：\n• GET = \"给我看菜单\"（获取数据）\n• POST = \"帮我下单\"（提交数据）\n• 状态码：200=成功  404=找不到  401=未授权  500=服务器出错\n\nimport requests\nresponse = requests.get(\"https://api.example.com/data\")\nif response.status_code == 200:\n    data = response.json()  # JSON → 字典\n\n🔄 螺旋复习：response.json()返回的就是字典！第3周学的字典和第4周学的JSON在这里完美汇合。",["GET获取数据，POST提交数据——两个最常用的HTTP方法","response.json()把JSON响应直接转为Python字典——字典和JSON知识在这里融合","状态码200=成功，4xx=你的问题，5xx=服务器的问题"],["安装requests：pip install requests（在虚拟环境中！）","调用免费天气API（wttr.in），解析JSON响应","打印格式化的天气信息","处理请求失败：检查status_code，加try/except"],"RESTful API是Web API设计规范：URL标识资源+HTTP方法标识操作。GET /users获取用户列表，POST /users创建新用户。",[["Requests快速上手(中文)","https://docs.python-requests.org/zh_CN/latest/user/quickstart.html","cn"],["wttr.in天气API","https://wttr.in/:help"]]],
[27,"POST请求与认证",6,"POST提交数据——比如登录、创建内容。认证是\"证明你是谁\"。\n\nAPI认证三种方式：\n• API Key：像门禁卡——在请求头或URL中传递\n• Bearer Token：像VIP手环——Authorization: Bearer xxx\n• OAuth：像第三方登录（用微信登录某APP）\n\nrequests.post(\n    url,\n    json={\"title\": \"hello\"},  # 发送JSON数据\n    headers={\"Authorization\": \"Bearer your-token\"}\n)",["POST用json=参数发送JSON数据（不是data=）","API Key放在headers中：{\"X-API-Key\": \"your-key\"}","response.raise_for_status()在状态码非200时自动抛异常"],["用POST请求测试httpbin.org（免费API测试工具）","调用需要API Key的服务（如OpenWeatherMap免费版）","实现完整的请求→响应→解析→展示流程","添加超时设置和错误处理"],"requests库的Session对象可保持cookies和认证信息。aiohttp是异步版本——下周学。",[["httpbin.org测试","https://httpbin.org/"]]],
[28,"环境变量与密钥管理（安全！）",6,"⚠️ 千万别把API Key写在代码里！上传到GitHub后任何人都能冒充你调用API。\n\n解决方案——环境变量：\n1. pip install python-dotenv\n2. 创建.env文件：API_KEY=sk-xxx\n3. 代码中读取：\n   from dotenv import load_dotenv\n   import os\n   load_dotenv()\n   key = os.getenv(\"API_KEY\")\n4. 把.env加入.gitignore！\n\n比喻：API Key是你家钥匙。代码是公开的房子图纸——你不会把钥匙画在图纸上。\n\nOpenAI官方安全指南也明确建议使用环境变量管理密钥。",["环境变量是系统级键值对，不属于代码——最重要的安全习惯","python-dotenv从.env文件加载环境变量到os.environ",".gitignore阻止.env上传——这是Day 1就该养成的意识，现在正式落实"],["安装python-dotenv，创建.env文件","重构天气工具：API Key存储在.env中","在.gitignore中添加.env","在README中说明\"请创建.env文件并添加API_KEY=xxx\"","验证：git status确认.env不在追踪列表中"],"生产环境用AWS Secrets Manager、HashiCorp Vault等密钥管理服务。Docker用-e参数传递环境变量。",[["python-dotenv","https://pypi.org/project/python-dotenv/"],["OpenAI密钥安全指南","https://help.openai.com/en/articles/5112595-best-practices-for-api-key-safety"]]],
[29,"异步编程入门(async/await)",6,"同步=餐厅傻等一道做完点下道。异步=同时点3道同时做。\n\nasync def fetch_weather(city):\n    # 假设这里是异步HTTP请求\n    response = await aiohttp_session.get(url)\n    return await response.json()\n\n# 同时查3个城市！\nresults = await asyncio.gather(\n    fetch_weather(\"北京\"),\n    fetch_weather(\"上海\"),\n    fetch_weather(\"广州\")\n)\n\n关键：先掌握同步requests（昨天学的），再理解为什么需要异步。MCP服务器和Claude Agent SDK全部基于async。",["async def定义异步函数，await等待异步操作完成","asyncio.gather()并发执行多个任务——比顺序执行快N倍","先掌握同步API调用，再学async——顺序很重要"],["写异步倒计时：asyncio.sleep模拟等待","用aiohttp异步版天气工具：同时查5个城市","计时比较：同步查5城 vs 异步查5城的耗时差异","理解事件循环event loop的基本概念"],"aiohttp是异步HTTP客户端。FastAPI（后面学部署时用）原生支持async。Claude Agent SDK的核心函数都是async的。",[["廖雪峰·异步IO","https://www.liaoxuefeng.com/wiki/1016959663602400/1017959540289152","cn"],["aiohttp文档","https://docs.aiohttp.org/"]]],
[30,"复习 + 每日简报项目",6,"本周：HTTP请求、API认证、环境变量、异步编程。\n\n项目：每日简报生成器。\n\n🔄 螺旋复习：这个项目串起了几乎所有知识——函数（M1W3）、字典（M1W3）、JSON（M1W4）、文件写入（M1W4）、错误处理（M1W4）、API调用（本周）、环境变量（本周）、异步（本周）、Git（M1W2）。如果你能独立完成这个项目，说明前6周的基础非常扎实。",["API调用完整流程：构造请求→发送→检查状态→解析JSON→处理数据","环境变量保护敏感信息是必须养成的习惯","异步并行调用让多个API请求同时执行"],["完成每日简报生成器（至少调用2个API）","用环境变量管理所有API Key","用async并行调用多个API","结果保存为格式化JSON文件","git commit + push到GitHub"],"试试用schedule库定时运行简报生成器——每天早上自动生成。这就是最简单的自动化，后面学Agent时会用更高级的调度方式。",[["NewsAPI","https://newsapi.org/"],["ExchangeRate-API","https://www.exchangerate-api.com/"]]],

[31,"pytest测试入门",7,"写代码不难，写正确的代码才难。测试就是\"用代码检查代码\"——自动验证你的函数是否正确。\n\npytest是Python最流行的测试框架：\n\n# test_calculator.py\ndef test_add():\n    assert add(2, 3) == 5\n\ndef test_divide_by_zero():\n    with pytest.raises(ZeroDivisionError):\n        divide(1, 0)\n\n运行：pytest test_calculator.py\n\n比喻：测试就像考试——你出题（测试用例），让代码当考生。考不过说明代码有bug。",["assert 表达式——如果为False就报错，为True就通过","测试函数以test_开头，pytest会自动发现并运行","先写测试再写代码叫TDD(测试驱动开发)——专业开发者常用"],["安装pytest：pip install pytest","为之前的BMI计算函数写3个测试用例","为is_prime函数写测试：包括边界情况(0, 1, 2, 负数)","为BankAccount类写测试：存款、取款、余额检查","运行pytest，学会读测试输出"],"AI Agent开发中，测试更加关键——你需要验证Agent的工具是否正确调用、输出是否符合预期。LangChain提供GenericFakeChatModel来模拟LLM响应做测试。",[["pytest官方文档","https://docs.pytest.org/"],["菜鸟·pytest教程","https://www.runoob.com/pytest/pytest-tutorial.html","cn"]]],
[32,"高级调试技巧与代码质量",7,"Day 5学了基础调试。今天进阶——像专业开发者一样debug。\n\nVS Code调试器详解：\n• 断点(Breakpoint)：点击行号左侧设置红点\n• F5启动调试，F10单步执行，F11进入函数内部\n• 变量面板：实时查看所有变量值\n• 监视表达式：监控特定表达式的值变化\n• 调用栈：看到当前执行到了函数调用的哪一层\n\nlogging模块比print调试更专业：\nimport logging\nlogging.basicConfig(level=logging.DEBUG)\nlogging.debug(f\"x = {x}\")  # 可以随时关闭，不用删除",["VS Code调试器的断点+F10单步是最强大的调试工具","logging模块比print更专业：可以设级别(DEBUG/INFO/WARNING/ERROR)，可以输出到文件","学会给bug分类：语法错误→逻辑错误→运行时错误——不同类型用不同方法查"],["用VS Code断点调试一个有3个bug的程序","用logging替代print调试——给之前的项目加logging","写一段包含逻辑错误的代码，用断点单步执行找出问题","练习代码审查(code review)：让Claude review你最近的代码"],"pylint和flake8是代码质量检查工具——自动发现潜在问题。black是代码格式化工具——一键统一代码风格。这些工具在团队协作中非常重要。",[["VS Code Python调试","https://code.visualstudio.com/docs/python/debugging"],["logging教程(中文)","https://docs.python.org/zh-cn/3/howto/logging.html","cn"]]],
[33,"类型提示与代码规范",7,"类型提示(Type Hints)告诉读者每个变量是什么类型：\n\ndef calculate_bmi(weight: float, height: float) -> float:\n    \"\"\"计算BMI指数\n    \n    Args:\n        weight: 体重(kg)\n        height: 身高(m)\n    Returns:\n        BMI指数\n    \"\"\"\n    return weight / height**2\n\n常用类型：str, int, float, bool, list[str], dict[str, Any], Optional[str]\n\nMCP的Python SDK大量使用类型提示——这是后面必须熟练的技能。",["冒号标注参数类型，->标注返回类型","Optional[str]等于str | None——值可能是字符串或None","docstring用Google风格或NumPy风格——写清楚参数和返回值含义"],["给之前所有项目的函数添加类型提示","给核心函数写docstring文档字符串","用PEP 8规范检查代码风格","安装mypy做静态类型检查（选做）"],"Pydantic是Python最流行的数据验证库，它把类型提示变成运行时检查。FastAPI和LangChain都基于Pydantic。Day 41后会频繁遇到。",[["PEP 8风格指南","https://peps.python.org/pep-0008/"]]],
[34,"Git进阶 + 分支管理",7,"Day 10学了git基础（add/commit）。今天进阶——分支是Git最强大的功能。\n\n分支(Branch)让你在不影响主代码的情况下开发新功能：\ngit branch feature-x → 创建分支\ngit checkout feature-x → 切换到分支\n（在分支上开发和commit）\ngit checkout main → 切回主分支\ngit merge feature-x → 合并分支\n\n比喻：分支就像平行宇宙——你在分支里随便改，主分支安全无损。满意了再合并。",["分支是独立的开发线路——互不影响","main/master是默认主分支——保持稳定","每个新功能用新分支开发→测试通过→合并到main"],["创建feature分支开发新功能","在分支上commit多次","合并分支到main","用git log --oneline --graph 查看分支图","制造一个合并冲突并手动解决"],"GitHub的Pull Request(PR)机制：在分支上开发→推到GitHub→创建PR请求review→合并。这是团队协作的标准流程。",[["廖雪峰·分支管理","https://www.liaoxuefeng.com/wiki/896043488029600/896954848507552","cn"]]],
[35,"螺旋复习 + 开发流程实战",7,"本周学了测试、调试、类型提示、Git分支。今天把2个月学到的一切串起来——形成完整的专业开发流程。\n\n专业开发流程：\n1. GitHub创建仓库 → clone\n2. 创建venv → pip install\n3. git checkout -b feature-x\n4. 写代码（带类型提示+docstring）\n5. 写测试（pytest）\n6. 调试（断点/logging）\n7. git add → commit\n8. git merge → push\n\n🔄 螺旋复习清单：函数→装饰器→类→继承→API→JSON→Git——画一张你知识的关联图。",["完整开发流程应该变成肌肉记忆——不看笔记也能走完全程","测试不是可选的——专业代码都有测试","代码质量三件套：类型提示+docstring+pytest"],["不看任何参考，从零走完完整开发流程3遍","为2个之前的项目补写pytest测试","画一张知识关联图：从变量到API，标注各概念间的联系","让Claude出一套Month 2综合测试"],"GitHub Actions可以在你push代码时自动运行pytest测试——这叫CI/CD（持续集成/持续部署）。了解概念即可，后面学部署时会用到。",[["Git工作流指南","https://www.atlassian.com/git/tutorials/comparing-workflows"]]],

[36,"数据处理综合实战",8,"综合运用所有技能处理真实数据。\n\n🔄 螺旋复习：数据处理串起了文件读写(W4)→JSON(W4)→字典(W3)→列表推导式(W2)→函数(W3)→错误处理(W4)。这就是螺旋学习的力量——旧知识在新场景中获得更深理解。",["真实数据总是\"脏\"的——需要清洗和转换","处理流程：读取→验证→清洗→分析→输出","这种数据管道(pipeline)思维在AI开发中无处不在"],["从Kaggle下载一个CSV数据集（或自造JSON数据）","清洗数据：处理缺失值、格式错误、重复项","分析数据：统计、排序、分组、Top N","输出：格式化报告+JSON结果文件","为数据处理函数写pytest测试"],"pandas是Python数据处理的王牌库（选学）。AI Agent开发中数据清洗和转换是常见任务——RAG需要处理文档、Agent需要解析API返回的JSON。",[["Kaggle数据集","https://www.kaggle.com/datasets"]]],
[37,"CLI工具箱项目 Day1：架构设计",8,"月度毕业项目：个人CLI工具箱——一个综合所有2个月知识的桥梁项目。\n\n项目要求（对标AI开发技能）：\n• 天气查询（API调用→后面调Claude API）\n• 待办管理（JSON持久化→后面Agent状态管理）\n• 记账功能（数据处理→后面RAG数据处理）\n• 汇率转换（多API组合→后面多工具组合）\n\n技术要求：OOP设计、类型提示、环境变量、pytest测试、Git分支管理、README文档",["先设计架构再编码——画出类图和模块关系","每个工具映射一个未来AI技能","用Git分支：每个功能一个branch→merge"],["设计项目架构图（类、模块、数据流）","创建GitHub仓库 + venv + git init","定义所有类的接口（方法签名+类型提示）","实现第一个工具（天气查询）+ 对应pytest"],"项目架构设计是软件工程最核心的技能之一。先画图再写代码——UML类图和数据流图是标准工具。",[["Click库（CLI框架）","https://click.palletsprojects.com/"]]],
[38,"CLI工具箱项目 Day2：核心功能",8,"继续开发：待办管理+记账功能。每完成一个功能就写测试+commit。\n\n🔄 螺旋复习：今天每个模块都在复用前面学的核心技能：\n• 待办管理 = 列表(W2) + 字典(W3) + JSON持久化(W4) + OOP(W5)\n• 记账功能 = 文件读写(W4) + 错误处理(W4) + 数据分析(W8D1)\n\n开发节奏：写功能代码 → 写pytest测试 → 通过测试 → git commit → 下一个功能。这就是专业开发者的日常循环。",["功能之间应该独立——修改一个不影响其他（这叫\"松耦合\"）","JSON持久化要考虑数据完整性——写入前先验证，写入后读回确认","用户体验：清晰的菜单提示、输入验证、友好的错误信息"],["完成待办管理模块 + pytest测试","完成记账功能模块 + pytest测试","集成到主菜单","每个功能用独立Git分支开发→merge"],"试试用Rich库美化终端输出——彩色文字、表格、进度条，让CLI工具看起来更专业。",[["Rich库（美化终端输出）","https://rich.readthedocs.io/"]]],
[39,"CLI工具箱项目 Day3：汇率+完善",8,"完成汇率转换（需要API调用+环境变量），全面打磨项目。\n\n汇率转换模块是最接近AI开发的部分——它需要：\n• 调用外部API（和Day 26学的HTTP请求一样）\n• 环境变量管理Key（Day 28学的密钥安全）\n• 解析JSON响应（Day 18学的JSON处理）\n• 错误处理（网络失败/API限流/无效币种）\n\n这就是为什么这个毕业项目是AI开发的\"桥梁\"——你在Month 3调用Claude API时，用的就是同样的技能组合。",["多个API调用组合→映射未来Agent的多工具调用","错误处理要覆盖所有边界：网络超时、API限流、无效输入、JSON解析失败","README是项目的门面——好的README包含项目说明+安装步骤+使用截图+技术栈"],["完成汇率转换模块（调用汇率API+环境变量）","添加全局异常处理和logging日志","运行完整pytest测试套件确保全部通过","写README：项目介绍、安装步骤、使用方法、截图"],"试试给CLI添加命令行参数支持（argparse模块），让用户可以 python tools.py weather 北京 直接查天气。",[["ExchangeRate-API","https://www.exchangerate-api.com/"]]],

function render(){
  const day=DAYS.find(d=>d.d===state.currentDay)||DAYS[0];
  const phase=PHASES.find(p=>p.id===day.phase);
  const total=Object.keys(state.checkins).length;

  const weekDays=DAYS.filter(d=>d.week===day.week);

  // Progress
  h+=`<div class="prog"><div class="prog-top"><span style="color:var(--td)">总进度</span><span style="font-weight:700;color:var(--g)">${total}/200天 · ${pct}%</span></div>`;
  h+=`<div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div><div class="phases">`;
  PHASES.forEach(p=>{
    const pd=DAYS.filter(d=>d.phase===p.id);
    const pc=pd.filter(d=>state.checkins[d.d]).length;
    const pp=pd.length?Math.round(pc/pd.length*100):0;
    h+=`<div class="ph" onclick="jumpPhase(${p.id})" title="${p.name}"><div class="ph-icon">${p.icon}</div><div class="ph-stat" style="color:${p.color}">${pc}/${pd.length}</div><div class="ph-bar"><div class="ph-fill" style="width:${pp}%;background:${p.color}"></div></div></div>`;
  });
  h+=`</div></div>`;
  
  // Nav
  h+=`<div class="nav">`;
  [["detail","📖 详情"],["calendar","📅 日历"],["list","📋 列表"],["profile","🧒 画像"],["tutor","🤖 导师"]].forEach(([v,l])=>{
    h+=`<button class="nav-btn${state.view===v?" on":""}" onclick="setView('${v}')">${l}</button>`;
  });
  h+=`<div class="jump"><label>跳转</label><select onchange="jumpDay(+this.value)">`;
  DAYS.forEach(d=>{h+=`<option value="${d.d}"${d.d===state.currentDay?" selected":""}>D${d.d} · ${d.t}</option>`});
  h+=`</select></div></div>`;
  
  // Views
  if(state.view==="detail"){
    // Day header
    h+=`<div class="day-hdr">`;
    h+=`<button class="day-nav" onclick="navDay(-1)"${state.currentDay<=1?" disabled":""}>◂</button>`;
    h+=`<div class="day-info"><div class="day-phase" style="color:${phase.color}">DAY ${day.d} · 第${day.week}周 · ${phase.name}</div><div class="day-title">${day.t}</div></div>`;
    h+=`<button class="checkin-btn ${state.checkins[day.d]?"done":"todo"}" onclick="toggleCheckin(${day.d})">${state.checkins[day.d]?"✓ 已打卡":"○ 打卡"}</button>`;
    h+=`<button class="day-nav" onclick="navDay(1)"${state.currentDay>=200?" disabled":""}>▸</button></div>`;
    
    // Week pills
    h+=`<div class="week-pills">`;
    weekDays.forEach(wd=>{
      const on=wd.d===state.currentDay;
      const ck=state.checkins[wd.d];
      h+=`<button class="wp${on?" on":""}${ck?" checked":""}" onclick="jumpDay(${wd.d})">D${wd.d}${ck?" ✓":""}</button>`;
    });
    h+=`</div>`;
    
    // Sections
    h+=renderSection("teach","🧑‍🏫 教程解说",phase.color,`<div class="teach">${esc(day.teach)}</div>`);
    
    let keysH="";day.keys.forEach((k,i)=>{keysH+=`<div class="key-item"><span class="key-num">${i+1}.</span><span>${esc(k)}</span></div>`});
    h+=renderSection("keys","⭐ 学习重点","#fbbf24",keysH);
    
    let tasksH="";day.tasks.forEach(t=>{tasksH+=`<div class="task-item"><span class="task-dot">•</span><span>${esc(t)}</span></div>`});
    h+=renderSection("tasks","📝 今日任务","#34d399",tasksH);
    
    h+=renderSection("extend","🚀 延展学习","#a78bfa",`<div class="extend-text">${esc(day.extend)}</div>`);
