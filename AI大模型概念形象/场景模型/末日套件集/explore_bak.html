<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>城市漫游 · 第一人称探索</title>
<style>
:root{--ink:#e8eef5;--sub:#9fb0c4;--panel:rgba(12,18,28,.82);--accent:#4da3ff}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#0b1018;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}
#canvas{display:block;width:100vw;height:100vh}
.hud{position:fixed;pointer-events:none;z-index:5}
#top{top:14px;left:14px;background:var(--panel);border:1px solid #2a3a4e;border-radius:10px;padding:12px 16px;max-width:330px}
#top h1{margin:0 0 4px;font-size:15px}
#top p{margin:2px 0;font-size:12px;color:var(--sub);line-height:1.6}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;text-align:center;
  background:var(--panel);border:1px solid #2a3a4e;border-radius:14px;padding:28px 40px;cursor:pointer;
  transition:opacity .25s}
#hint h2{margin:0 0 10px;font-size:20px}
#hint p{margin:6px 0;color:var(--sub);font-size:13px}
#hint .go{display:inline-block;margin-top:12px;padding:10px 24px;background:var(--accent);color:#fff;border-radius:8px;font-weight:600}
#bottom{bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid #2a3a4e;
  border-radius:10px;padding:10px 18px;font-size:12px;color:var(--sub);display:flex;gap:18px;white-space:nowrap}
#bottom b{color:var(--ink);font-variant-numeric:tabular-nums}
.ctrl{position:fixed;right:14px;top:14px;background:var(--panel);border:1px solid #2a3a4e;border-radius:10px;padding:12px;z-index:6;width:200px}
.ctrl label{font-size:12px;color:var(--sub);display:block;margin:8px 0 4px}
.ctrl input[type=range]{width:100%}
.ctrl button{width:100%;margin-top:10px;padding:8px;background:#24374d;color:var(--ink);border:1px solid #35506e;
  border-radius:7px;cursor:pointer;font-size:12px}
.ctrl button:hover{background:#2e4a68}
#loading{position:fixed;inset:0;z-index:20;background:#0b1018;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px}
#loading .bar{width:320px;height:6px;background:#1e2b3b;border-radius:4px;overflow:hidden}
#loading .fill{height:100%;width:0;background:var(--accent);transition:width .2s}
#loading p{color:var(--sub);font-size:13px;margin:0}
</style>
<script type="importmap">
{"imports":{"three":"./js/three.module.js"}}
</script>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loading">
  <h2 style="margin:0">正在加载城市…</h2>
  <div class="bar"><div class="fill" id="lfill"></div></div>
  <p id="ltext">读取轻量探索地图（约 5MB），请稍候</p>
</div>

<div id="hint">
  <h2>🚶 城市漫游</h2>
  <p>以真人 1.7 米视角探索这座城市</p>
  <p>WASD 行走 · 鼠标环视 · Shift 加速 · Q/E 升降</p>
  <p style="color:#7f93a8;font-size:12px">按 ESC 释放鼠标 · 点击画面继续</p>
  <div class="go">点击进入漫游</div>
</div>

<div class="hud" id="top">
  <h1>城市漫游 · 第一人称</h1>
  <p>视角高度 = 1.7 米（真人比例）</p>
  <p>点击画面锁定鼠标，WASD 移动</p>
</div>

<div class="ctrl">
  <label>移动速度 <span id="spdval">12</span></label>
  <input type="range" id="speed" min="3" max="40" value="12">
  <label>视角高度 <span id="hval">1.7</span> 米</label>
  <input type="range" id="eyeheight" min="1" max="30" step="0.1" value="1.7">
  <button id="reset">回到街道起点</button>
  <button id="topview">切换到俯瞰</button>
</div>

<div class="hud" id="bottom">
  <span>位置 X <b id="px">0</b></span>
  <span>Z <b id="pz">0</b></span>
  <span>速度 <b id="pv">0</b></span>
  <span>模式 <b id="mode">行走</b></span>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './js/GLTFLoader.js';
import { PointerLockControls } from './js/PointerLockControls.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc3e8);
scene.fog = new THREE.Fog(0x9fc3e8, 180, 1200);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 5000);
const EYE = 1.7;                 // human eye height in world units (1 unit = 1 meter)
// start inside a dense district facing its buildings (quarter center ~ -189/-189)
const START = new THREE.Vector3(-189, EYE, -150);
camera.position.copy(START);
camera.lookAt(-189, 8, -230);    // face toward the block buildings

// lighting
scene.add(new THREE.HemisphereLight(0xdfefff, 0x404850, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(200, 400, 150);
scene.add(sun);

const controls = new PointerLockControls(camera, document.body);
const hint = document.getElementById('hint');
hint.addEventListener('click', ()=> controls.lock());
controls.addEventListener('lock', ()=>{ hint.style.opacity='0'; hint.style.pointerEvents='none'; });
controls.addEventListener('unlock', ()=>{ hint.style.opacity='1'; hint.style.pointerEvents='auto'; });

// keyboard movement
const keys = {w:false,a:false,s:false,d:false,shift:false,q:false,e:false};
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k in keys) keys[k]=true;
  if(k==='shift') keys.shift=true;
});
addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  if(k in keys) keys[k]=false;
  if(k==='shift') keys.shift=false;
});

let speed = 12, eyeH = EYE, fly = false;
document.getElementById('speed').oninput = e=>{ speed=+e.target.value; document.getElementById('spdval').textContent=speed; };
document.getElementById('eyeheight').oninput = e=>{
  eyeH=+e.target.value; document.getElementById('hval').textContent=eyeH.toFixed(1);
  camera.position.y = eyeH;
};
document.getElementById('reset').onclick = ()=>{
  camera.position.copy(window.__START || START); camera.position.y=eyeH;
};
document.getElementById('topview').onclick = ()=>{
  const top = camera.position.y > 100;
  camera.position.y = top ? eyeH : 600;
  document.getElementById('mode').textContent = top ? '行走' : '俯瞰';
};

// load model with progress
const loader = new GLTFLoader();
const fill = document.getElementById('lfill'), ltext = document.getElementById('ltext');
loader.load('./city_variants/explore_map.glb',
  gltf=>{
    const model = gltf.scene;
    scene.add(model);
    // Auto-place camera in front of a real building so the first view shows architecture.
    // Find a walkable building mesh (non-road), compute its box, stand ~14m in front of it.
    let target=null, best=-1;
    model.traverse(o=>{
      if(o.isMesh && !/ground|road|lane|ln|rh|rv/.test(o.name)){
        const box=new THREE.Box3().setFromObject(o);
        const c=box.getCenter(new THREE.Vector3());
        const h=box.max.y-box.min.y;
        // prefer a tall building in the commercial quarter for an impressive first view
        const score=h - (Math.abs(c.x+252)+Math.abs(c.z+252))*0.01;
        if(score>best){ best=score; target={c,box}; }
      }
    });
    if(target){
      const min=target.box.min, max=target.box.max;
      const h=max.y-min.y;
      // stand 14 units toward +Z from the building front, at eye height
      camera.position.set(target.c.x, EYE, max.z+14);
      camera.up.set(0,1,0);
      camera.lookAt(target.c.x, Math.min(h*0.5, 10), target.c.z);
      window.__START=camera.position.clone();
    } else {
      camera.position.copy(START); camera.lookAt(-189,8,-260);
    }
    document.getElementById('loading').style.display='none';
    ltext.textContent='加载完成';
  },
  ev=>{
    if(ev.lengthComputable){
      const p=(ev.loaded/ev.total*100).toFixed(0);
      fill.style.width=p+'%';
      ltext.textContent=`加载模型 ${p}% · ${(ev.loaded/1048576).toFixed(0)} / ${(ev.total/1048576).toFixed(0)} MB`;
    } else {
      ltext.textContent=`加载模型 ${(ev.loaded/1048576).toFixed(0)} MB…`;
    }
  },
  err=>{ ltext.textContent='加载失败：'+err.message; console.error(err); }
);

// movement loop
const clock = new THREE.Clock();
const dir = new THREE.Vector3(), right = new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  if(controls.isLocked){
    const v = speed * (keys.shift ? 3 : 1) * dt;
    camera.getWorldDirection(dir); dir.y=0; dir.normalize();
    right.crossVectors(dir, camera.up).normalize();
    let moved=0;
    if(keys.w){ camera.position.addScaledVector(dir, v); moved=v; }
    if(keys.s){ camera.position.addScaledVector(dir,-v); moved=v; }
    if(keys.d){ camera.position.addScaledVector(right, v); moved=v; }
    if(keys.a){ camera.position.addScaledVector(right,-v); moved=v; }
    if(keys.q){ camera.position.y-=v; }
    if(keys.e){ camera.position.y+=v; }
    // keep on ground when walking
    if(!keys.q && !keys.e) camera.position.y = eyeH;
    document.getElementById('pv').textContent = (moved/dt||0).toFixed(0);
  }
  document.getElementById('px').textContent = camera.position.x.toFixed(0);
  document.getElementById('pz').textContent = camera.position.z.toFixed(0);
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
