<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>启幕 · 不同主题的冷启动演出</title><style>body{margin:32px;background:#10171c;color:#ecf3f2;font:17px "Microsoft YaHei UI",sans-serif}main{max-width:1100px;margin:auto}select{padding:12px;font:inherit;background:#24343e;color:inherit;border-radius:10px}video{display:block;width:100%;margin:20px 0;border-radius:16px}p{color:#aabfc6}</style><main><h1>不同主题的冷启动演出</h1><p>各主题采用自己的动画过程。每段约 12 秒；切换角色可比较不同演出。</p><select id="theme"><option value="claude-art">Claude · 暖阳书阁 · 书阁翻章</option><option value="gemini-anime">Gemini · 星幻猫娘 · 棱镜分光</option><option value="grok-art">Grok · 黑洞漫游 · 引力航道</option><option value="seed-art">Seed 2.0 · 万物萌芽 · 破土成林</option></select><video controls autoplay loop src="claude-art.webm"></video><script>document.querySelector('select').onchange=e=>{const v=document.querySelector('video');v.src=e.target.value+'.webm';v.play()}</script></main></html>
