let current=null,mode='cold';const $=s=>document.querySelector(s),action=$('#action'),background=$('#background');
$('#summary').textContent='已接入 '+themes.filter(t=>t.video?.verified).length+' / '+themes.length+' 套，每套包含冷启动、恢复和循环背景。';
function select(theme){current=theme;$('#title').textContent=theme.name;document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('active',b.dataset.theme===theme.id));document.querySelectorAll('[data-mode]').forEach(b=>b.disabled=!theme.video?.verified);action.pause();background.pause();action.hidden=false;background.hidden=true;action.removeAttribute('src');action.poster=theme.reference;action.load();$('#detail').textContent=theme.video?.verified?'选择一种模式预览完整衔接。':'此套尚未接入最终成片。'}
themes.forEach(theme=>{const button=document.createElement('button');button.dataset.theme=theme.id;const label=document.createElement('span');label.textContent=theme.name;const state=document.createElement('small');state.textContent=theme.video?.verified?'完整三段 · 已验收':'生成 / 验收中';button.append(label,state);button.onclick=()=>select(theme);$('#themes').append(button)});
async function play(next){if(!current?.video?.verified)return;mode=next;action.pause();background.pause();background.hidden=true;action.hidden=false;const spec=current.video;action.poster=current.reference;action.src='../../resources/'+spec[next].file;action.loop=next==='background';if(next!=='background'){background.src='../../resources/'+spec.background.file;background.load()}$('#detail').textContent=(next==='cold'?current.coldLabel:next==='warm'?current.warmLabel:'自然循环背景')+' · '+(spec[next].durationMs/1000).toFixed(2)+' 秒';try{await action.play()}catch{ $('#detail').textContent='点击视频播放按钮开始。'}}
action.onended=async()=>{if(mode==='background'||!current?.video)return;const start=()=>{background.currentTime=current.video.handoffSeconds;background.addEventListener('seeked',async()=>{background.hidden=false;action.hidden=true;await background.play();$('#detail').textContent='已衔接循环背景。'},{once:true})};if(background.readyState>=2)start();else background.addEventListener('loadeddata',start,{once:true})};
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>play(button.dataset.mode));$('#pause').onclick=()=>{const video=action.hidden?background:action;if(video.paused)video.play();else video.pause()};select(themes.find(t=>t.video?.verified)||themes[0]);</script></html>
