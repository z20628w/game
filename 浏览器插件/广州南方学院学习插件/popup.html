<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>广州南方学院学习插件</title>
  <style>
    body {
      width: 400px;
      padding: 14px 16px;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
      font-size: 13px;
      color: #333;
    }
    h3 {
      margin: 0 0 4px;
      font-size: 15px;
    }
    .sub {
      margin: 0 0 12px;
      color: #888;
      font-size: 12px;
    }
    .cfg {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .cfg .lbl {
      width: 74px;
      flex-shrink: 0;
    }
    select {
      padding: 3px 6px;
      font-size: 13px;
    }
    .cfg .check {
      margin-left: auto;
    }
    .divider {
      border-top: 1px solid #e5e5e5;
      margin: 12px 0;
    }
    .actions button {
      padding: 6px 14px;
      margin-right: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <h3>自动学习配置</h3>
  <p class="sub">配置自动保存，修改后对已开启的页面立即生效</p>

  <div class="cfg">
    <span class="lbl">播放倍速</span>
    <select id="speed"></select>
    <label class="check"><input type="checkbox" id="enableSpeed" checked> 自动设置</label>
  </div>
  <div class="cfg">
    <input type="checkbox" id="enableChain" checked>
    <label for="enableChain">自动开启连续播放</label>
  </div>
  <div class="cfg">
    <input type="checkbox" id="enableModal" checked>
    <label for="enableModal">自动确认“提示”弹窗</label>
  </div>
  <div class="cfg">
    <input type="checkbox" id="enableResume" checked>
    <label for="enableResume">暂停后自动恢复播放</label>
  </div>

  <div class="divider"></div>
  <div class="actions">
    <button id="autLearning">开启自动学习</button>
    <button id="getAnswers">开启获取答案</button>
  </div>
  <div class="hint">
    提示：测评题、扫码验证、照片采集弹窗不会自动处理，需手动操作。
  </div>

  <script src="./popup.js"></script>
</body>

</html>
